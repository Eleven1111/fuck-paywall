[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-agent"
version = "0.1.0"
description = "多平台创作 Agent 的 P1 MVP：母站 Substack + X 单帖 / Substack Notes 辐条，全部人工发布"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.4.0",
  "pyyaml>=6.0",
  "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
graph = ["langgraph>=1.2", "langgraph-checkpoint-sqlite>=3.0"]   # P4：ca flow
voice = ["faster-whisper>=1.0"]                                   # P4：ca interview --audio

[project.scripts]
ca = "creator_agent.cli:main"

[tool.setuptools.packages.find]
include = ["creator_agent*"]

[tool.setuptools.package-data]
creator_agent = ["templates/**/*"]
